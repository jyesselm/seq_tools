[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rna_seq_tools"
version = "0.10.0"
description = "simple functions for manipulating sequences and secondary structures in pandas dataframe format"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Joe Yesselman", email = "jyesselm@unl.edu"}
]
keywords = ["seq_tools", "bioinformatics", "sequences", "RNA", "DNA"]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "wheel>=0.22",
    "click",
    "editdistance",
    "tabulate",
    "numpy",
    "pandas",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "vienna",
]

[project.scripts]
seq-tools = "seq_tools.cli:cli"

[tool.setuptools]
packages = ["seq_tools"]

[tool.setuptools.package-data]
seq_tools = [
    "resources/*.csv",
    "resources/**/*.csv",
]

[tool.wheel]
universal = true

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cov=seq_tools --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "C901",  # Complexity - will be addressed during refactoring
    "E501",  # Line too long - formatter handles this
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
