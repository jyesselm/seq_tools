name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install ViennaRNA (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y viennarna

    - name: Install ViennaRNA (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install viennarna

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Lint with ruff
      run: |
        ruff check seq_tools/ test/

    - name: Format check with ruff
      run: |
        ruff format --check seq_tools/ test/

    - name: Type check with mypy
      run: |
        mypy seq_tools/
      continue-on-error: true

    - name: Run tests with pytest
      run: |
        pytest test/ -v --tb=short --cov=seq_tools --cov-report=term-missing --cov-report=xml --cov-fail-under=90

    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
